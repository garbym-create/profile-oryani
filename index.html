<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הפרופיל האורייני — כלי תמיכה בהחלטה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:light;
    --navy:#243b53; --deep:#2c6e8f; --mid:#4a92b0; --ice:#eef6f9; --ice2:#cfe4ec;
    --coral:#d9705c; --gold:#d9a441; --green:#4f9068; --grey:#6b7c8c; --line:#dde7ee;
    --bg:#f7f4ef; --card:#ffffff; --shadow:0 2px 14px rgba(36,59,83,.07);
    --p1:#dceee2; --p2:#e8f2ea; --p3:#fdf0d9; --p4:#fbe6de; --p5:#f7dcd9;
    --r:18px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--navy);
    font-family:"Heebo","Assistant","Segoe UI",Arial,Helvetica,sans-serif;
    direction:rtl;text-align:right;line-height:1.65;-webkit-font-smoothing:antialiased}
  .wrap{max-width:940px;margin:0 auto;padding:20px 16px 40px}
  header{background:linear-gradient(135deg,#2c6e8f 0%,#243b53 100%);color:#fff;
    border-radius:22px;padding:26px 26px 24px;margin-bottom:16px;box-shadow:0 6px 22px rgba(36,59,83,.16)}
  header h1{margin:0 0 6px;font-size:1.5rem;font-weight:800;letter-spacing:-.2px}
  header p{margin:0;color:#d3e6ef;font-size:.92rem}
  .steps{display:flex;gap:10px;margin:16px 0 20px}
  .step{flex:1;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 8px;
    text-align:center;font-size:.86rem;font-weight:600;color:var(--grey);cursor:pointer;
    transition:all .18s ease;box-shadow:var(--shadow)}
  .step:hover{border-color:var(--mid);color:var(--deep);transform:translateY(-1px)}
  .step.on{background:var(--deep);color:#fff;border-color:var(--deep);font-weight:800;
    box-shadow:0 4px 14px rgba(44,110,143,.32)}
  .step.done{border-color:var(--green);color:var(--green);background:#f2f9f5}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:22px;margin-bottom:16px;box-shadow:var(--shadow)}
  .card h2{margin:0 0 5px;font-size:1.14rem;font-weight:800;color:var(--deep)}
  .card .sub{margin:0 0 16px;color:var(--grey);font-size:.88rem}
  .q{border-top:1px solid #f0f5f8;padding:14px 0}
  .q:first-of-type{border-top:0}
  .q p{margin:0 0 10px;font-size:.97rem;font-weight:700}
  .tri{display:flex;gap:9px;flex-wrap:wrap}
  .tri button{flex:1 1 auto;min-width:104px;min-height:48px;border-radius:12px;border:1.5px solid var(--line);
    background:#fbfdfe;color:var(--navy);font:inherit;font-size:.92rem;cursor:pointer;
    padding:10px 14px;transition:all .15s ease}
  .tri button:hover{border-color:var(--mid);background:var(--ice)}
  .tri button[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:#fff;font-weight:700;
    box-shadow:0 3px 10px rgba(44,110,143,.26)}
  .tri button[aria-pressed="true"][data-v="כן"]{background:var(--green);border-color:var(--green)}
  .tri button[aria-pressed="true"][data-v="לא"]{background:var(--coral);border-color:var(--coral)}
  .tri button[aria-pressed="true"][data-v="לא נבדק"]{background:var(--grey);border-color:var(--grey)}
  .fld{margin-bottom:18px}
  .fld > label{display:block;font-weight:800;font-size:.95rem;margin-bottom:8px}
  .opts{display:flex;flex-wrap:wrap;gap:9px}
  .opts button{flex:1 1 auto;min-width:100px;min-height:48px;padding:10px 14px;border-radius:12px;
    border:1.5px solid var(--line);background:#fbfdfe;color:var(--navy);font:inherit;font-size:.92rem;
    cursor:pointer;transition:all .15s ease}
  .opts button:hover{border-color:var(--mid);background:var(--ice)}
  .opts button[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:#fff;font-weight:700;
    box-shadow:0 3px 10px rgba(44,110,143,.26)}
  .scale{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .scale button{min-width:48px;min-height:48px;border-radius:12px;border:1.5px solid var(--line);
    background:#fbfdfe;font:inherit;font-size:1.02rem;cursor:pointer;transition:all .15s ease}
  .scale button:hover{border-color:var(--mid)}
  .scale button[aria-pressed="true"]{background:var(--mid);border-color:var(--mid);color:#fff;font-weight:800}
  .scale span{color:var(--grey);font-size:.86rem}
  .note{background:var(--ice);border-right:5px solid var(--deep);border-radius:12px;
    padding:14px 16px;font-size:.9rem;margin:14px 0 4px}
  .warn{background:#fdf6e7;border-right:5px solid var(--gold);border-radius:12px;
    padding:14px 16px;font-size:.89rem;margin-top:16px}
  .nav{display:flex;gap:12px;margin-top:8px}
  .nav button{flex:1;min-height:54px;border-radius:14px;border:0;font:inherit;font-size:1.02rem;
    font-weight:800;cursor:pointer;transition:all .16s ease}
  .primary{background:var(--deep);color:#fff;box-shadow:0 4px 14px rgba(44,110,143,.3)}
  .primary:hover:not(:disabled){background:#23596f;transform:translateY(-1px)}
  .primary:disabled{background:#c3d2dc;box-shadow:none;cursor:not-allowed}
  .ghost{background:#fff;color:var(--deep);border:1.5px solid var(--line)!important}
  .ghost:hover{border-color:var(--mid)!important;background:var(--ice)}
  .prof{border:1.5px solid var(--line);border-radius:var(--r);margin-bottom:14px;overflow:hidden;
    box-shadow:var(--shadow);transition:all .18s ease}
  .prof .top{padding:14px 18px}
  .prof .top b{font-size:1.04rem;font-weight:800} .prof .top span{color:#4a5a6a;font-size:.88rem}
  .prof.sel{border-color:var(--deep);box-shadow:0 0 0 3px rgba(44,110,143,.16),0 4px 16px rgba(36,59,83,.1)}
  .prof .body{background:#fff;border-radius:14px;margin:0 12px 12px;padding:12px 16px 14px;font-size:.9rem}
  .desc{list-style:none;margin:0;padding:0}
  .desc li{display:flex;gap:9px;padding:8px 0;border-top:1px solid #f0f5f8}
  .desc li:first-child{border-top:0}
  .mark{flex:0 0 24px;text-align:center;font-weight:800}
  .ok{color:var(--green)} .no{color:var(--coral)} .na{color:#b6c3cd}
  .cnt{font-size:.85rem;color:var(--grey);margin-top:10px;font-weight:600}
  .pick{width:100%;min-height:50px;border-radius:12px;border:1.5px solid var(--deep);background:#fff;
    color:var(--deep);font:inherit;font-weight:800;cursor:pointer;margin-top:12px;transition:all .16s ease}
  .pick:hover{background:var(--ice)}
  .prof.sel .pick{background:var(--deep);color:#fff}
  .out h3{color:var(--deep);font-size:1.04rem;font-weight:800;margin:20px 0 9px}
  .out .cat{margin:14px 0 6px;font-size:.88rem;font-weight:800;color:var(--grey);
    letter-spacing:.2px}
  .out .cat:first-of-type{margin-top:8px}
  .out ul{margin:0;padding-right:22px} .out li{margin-bottom:7px;font-size:.93rem}
  .badge{display:inline-block;padding:8px 18px;border-radius:999px;font-weight:800;
    border:1px solid rgba(36,59,83,.1)}
  a{color:var(--deep)}
  .credits{text-align:center;color:var(--grey);font-size:.85rem;margin-top:26px;padding-top:18px;
    border-top:1px solid var(--line)}
  .credits b{color:var(--deep);font-weight:700}

  /* --- אקורדיון --- */
  details.acc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    margin-bottom:16px;box-shadow:var(--shadow);overflow:hidden}
  details.acc > summary{list-style:none;cursor:pointer;padding:18px 22px;display:flex;
    align-items:center;justify-content:space-between;gap:12px;transition:background .15s ease}
  details.acc > summary::-webkit-details-marker{display:none}
  details.acc > summary:hover{background:var(--ice)}
  details.acc > summary .t{display:block;font-size:1.14rem;font-weight:800;color:var(--deep)}
  details.acc > summary .s{display:block;color:var(--grey);font-size:.86rem;margin-top:2px;font-weight:400}
  details.acc > summary .chev{flex:0 0 30px;height:30px;border-radius:50%;background:var(--ice);
    color:var(--deep);font-weight:800;font-size:1.1rem;line-height:30px;text-align:center;
    transition:transform .2s ease}
  details.acc[open] > summary{border-bottom:1px solid var(--line)}
  details.acc[open] > summary .chev{transform:rotate(45deg)}
  details.acc .accbody{padding:6px 22px 20px}
  details.acc .accbody .q:first-of-type{border-top:0}

  /* --- גרף התקדמות --- */
  .prog{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;
    margin-bottom:18px;box-shadow:var(--shadow)}
  .prog .lbl{display:flex;justify-content:space-between;align-items:baseline;
    font-size:.86rem;color:var(--grey);margin-bottom:9px}
  .prog .lbl b{color:var(--deep);font-weight:800;font-size:.94rem}
  .prog .track{height:10px;border-radius:99px;background:#e7eef3;overflow:hidden}
  .prog .fill{height:100%;border-radius:99px;width:0;
    background:linear-gradient(90deg,var(--mid),var(--green));transition:width .35s ease}
  .prog.full .fill{background:linear-gradient(90deg,var(--green),#3d7a55)}
  @media print{ details.acc{border:0;box-shadow:none} details.acc > summary{display:none}
    details.acc .accbody{padding:0} .prog{display:none} }

  /* --- כרטיסי הפרופילים --- */
  .prof{border:1.5px solid var(--line);border-radius:var(--r);margin-bottom:12px;
    overflow:hidden;box-shadow:var(--shadow)}
  .prof .top{padding:14px 18px}
  .prof .top b{font-size:1.02rem;font-weight:800} .prof .top span{color:#4a5a6a;font-size:.88rem}
  .prof.sel{border-color:var(--deep);box-shadow:0 0 0 3px rgba(44,110,143,.16),0 4px 16px rgba(36,59,83,.1)}
  .prof .body{background:#fff;border-radius:14px;margin:0 12px 12px;padding:12px 16px 14px;font-size:.9rem}
  .cnt{font-size:.85rem;color:var(--grey);margin-top:10px;font-weight:600}
  @media print{ .prof{border:0;box-shadow:none} }
  @media (max-width:520px){
    .tri button,.opts button{flex:1 1 100%}
    .wrap{padding:14px 11px 34px}
    header{padding:20px 18px;border-radius:18px} header h1{font-size:1.22rem}
    .card{padding:16px} .steps{gap:6px} .step{padding:10px 4px;font-size:.78rem}
    .nav{flex-direction:column}
  }
  @media print{ body{background:#fff} .steps,.nav,.no-print,header{display:none!important}
    .card{border:0;padding:0;margin:0 0 10px;box-shadow:none} .wrap{max-width:100%;padding:0}
    .credits{border-top:1px solid #ccc} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>הפרופיל האורייני — כלי תמיכה בהחלטה</h1>
    <p>סימון המאפיינים הרשמיים · השוואה מול חמשת הפרופילים · פרקטיקות, מטרות ומדדי תוצאה</p>
  </header>
  <div class="steps no-print">
    <div class="step on" id="s1" onclick="go(1)">1 · מאפיינים</div>
    <div class="step" id="s2" onclick="go(2)">2 · בחירת פרופיל</div>
    <div class="step" id="s3" onclick="go(3)">3 · מיקוד ההוראה</div>
  </div>
  <div class="prog no-print" id="prog" hidden>
    <div class="lbl"><span>התקדמות הסימון</span><b id="progtxt">0 מתוך 9</b></div>
    <div class="track"><div class="fill" id="progfill"></div></div>
  </div>
  <div id="v1"></div><div id="v2" hidden></div><div id="v3" hidden></div>
  <div class="credits">ממעבדת הניסויים של <b>מרי גרבי</b> בשיתוף <b>טלי מימון</b></div>
</div>

<script>
/* ====== הצירים והמאפיינים — כלשונם במסמך "הפרופיל האורייני לתלמידים בכיתות ב'–ו'" ====== */
/* כל ציר = בחירה אחת. האפשרויות הן הניסוחים הרשמיים, והן מוציאות זו את זו. */
const AXES=[
 {k:"read", t:"הקריאה", o:[
   ["קריאתם רהוטה","קריאתו רהוטה","קריאתה רהוטה"],
   ["קריאתם לרוב מדויקת ורציפה","קריאתו לרוב מדויקת ורציפה","קריאתה לרוב מדויקת ורציפה"],
   ["קריאתם לא מדויקת או מקוטעת, או מקוטעת ולא מדויקת","קריאתו לא מדויקת או מקוטעת, או מקוטעת ולא מדויקת","קריאתה לא מדויקת או מקוטעת, או מקוטעת ולא מדויקת"]]},
 {k:"havana", t:"הבנת הנקרא", o:[
   ["מבינים היטב את הנקרא","מבין היטב את הנקרא","מבינה היטב את הנקרא"],
   ["מבינים את הנקרא באופן חלקי","מבין את הנקרא באופן חלקי","מבינה את הנקרא באופן חלקי"],
   ["רכשו את הקריאה אך מבינים את הנקרא באופן חלקי","רכש את הקריאה אך מבין את הנקרא באופן חלקי","רכשה את הקריאה אך מבינה את הנקרא באופן חלקי"]]},
 {k:"siach", t:"השתתפות בשיח האורייני", o:[
   ["משתתפים בשיח האורייני ומפיקים שיח מורחב","משתתף בשיח האורייני ומפיק שיח מורחב","משתתפת בשיח האורייני ומפיקה שיח מורחב"],
   ["משתתפים בשיח האורייני","משתתף בשיח האורייני","משתתפת בשיח האורייני"],
   ["משתתפים בשיח האורייני ומצליחים להביע עצמם בשיח הדבור","משתתף בשיח האורייני ומצליח להביע את עצמו בשיח הדבור","משתתפת בשיח האורייני ומצליחה להביע את עצמה בשיח הדבור"],
   ["ממעטים לקחת חלק בשיח האורייני","ממעט לקחת חלק בשיח האורייני","ממעטת לקחת חלק בשיח האורייני"]]},
 {k:"safa", t:"שפה והבעה", o:[
   ["מתבטאים בצורה תקינה ועם אוצר מילים רחב","מתבטא בצורה תקינה ועם אוצר מילים רחב","מתבטאת בצורה תקינה ועם אוצר מילים רחב"],
   ["שולטים בשפה ומשתמשים בה בביטחון למגוון מטרות חברתיות ותקשורתיות","שולט בשפה ומשתמש בה בביטחון למגוון מטרות חברתיות ותקשורתיות","שולטת בשפה ומשתמשת בה בביטחון למגוון מטרות חברתיות ותקשורתיות"],
   ["מגלים חולשה שפתית בהבנה ובהבעה","מגלה חולשה שפתית בהבנה ובהבעה","מגלה חולשה שפתית בהבנה ובהבעה"]]},
 {k:"ktiva", t:"כתיבה", o:[
   ["כותבים למטרות שונות וכתיבתם מפותחת","כותב למטרות שונות וכתיבתו מפותחת","כותבת למטרות שונות וכתיבתה מפותחת"],
   ["כתיבתם אינה מפותחת (בהיבט של תוכן ומבנה)","כתיבתו אינה מפותחת (בהיבט של תוכן ומבנה)","כתיבתה אינה מפותחת (בהיבט של תוכן ומבנה)"],
   ["כתיבתם אינה מפותחת (בהיבט של תוכן ומבנה, ובייצוג מורפו־אורתוגרפי של מילים)","כתיבתו אינה מפותחת (בהיבט של תוכן ומבנה, ובייצוג מורפו־אורתוגרפי של מילים)","כתיבתה אינה מפותחת (בהיבט של תוכן ומבנה, ובייצוג מורפו־אורתוגרפי של מילים)"]]}
];
/* מאפיינים שאינם על ציר — סימון כן/לא */
const YN=[
 {k:"mukra", t:["מבינים טקסטים המוקראים להם","מבין טקסטים המוקראים לו","מבינה טקסטים המוקראים לה"]},
 {k:"hana",  t:["נהנים לקרוא ולכתוב","נהנה לקרוא ולכתוב","נהנית לקרוא ולכתוב"]},
 {k:"bitachon", t:["מגלים ביטחון אורייני","מגלה ביטחון אורייני","מגלה ביטחון אורייני"]},
 {k:"atzmai", t:["משתמשים בכישורים האורייניים באופן עצמאי לצורכי למידה","משתמש בכישורים האורייניים באופן עצמאי לצורכי למידה","משתמשת בכישורים האורייניים באופן עצמאי לצורכי למידה"]},
 {k:"otzar", t:["מגלים חוסר באוצר מילים ובידע לשוני","מגלה חוסר באוצר מילים ובידע לשוני","מגלה חוסר באוצר מילים ובידע לשוני"]}
];

const PROFS=[
 {n:1,name:"תלמידים שכישוריהם השפתיים והאורייניים מפותחים",fill:"var(--p1)",
  ax:{read:0,havana:0,siach:0,safa:0,ktiva:0}, yn:["hana","bitachon","atzmai"],
  prfocus:"קידום הישגים ומצוינות אוריינית",
  goals:["שכלול מיומנויות אורייניות מסדר גבוה","קידום מצוינות אוריינית"],
  meas:["השתתפות פעילה במיזמים חינוכיים","מצליחים לנתח ולהשוות טקסטים, קוראים קריאה ביקורתית, יוצרים אינטגרציה ומיזוג, מנסחים שאלות מעמיקות","ממירים טקסט מסוגה אחת לאחרת","מפגינים ניהול עצמאי של משימות אורייניות מורכבות"],
  ped:["הרחבת ההתנסויות האורייניות","הקצאת משימות חקר עצמאיות (PBL)","הקצאת משימות המשלבות מעבר בין אופנויות","יוזמות חינוכיות: עריכת עיתון בית-ספרי או כיתתי · דיבייט · שידורי הסכתים · מועדוני קריאה · תחרויות כתיבה","כתיבת מאמרי עמדה בסוגיות אקטואליות","שילוב התלמידים בהובלת שיח בקבוצות עיון ודיון","התערבות \"אחרי\" — רפלקציה ומטא-קוגניציה, משוב כתוב"],
  mats:[],
  prac:["קריאה של טקסטים מסוגים שונים למטרות שונות","עיון ודיון","למידה בחברותא","עידוד קריאה","התנסויות בהבעה בכתב למטרות שונות, גם בהתבסס על טקסטים שנקראו, תוך שימוש במיומנויות מיזוג, הכללה וחשיבה ביקורתית"]},
 {n:2,name:"תלמידים שכישוריהם השפתיים והאורייניים טובים",fill:"var(--p2)",

    SRC.map(x=>'<li style="margin-bottom:7px"><a href="'+x[1]+'" target="_blank" rel="noopener">'+esc(x[0])+'</a></li>').join('')+
    '</ul>');

  h+='<div class="nav no-print"><button class="primary" onclick="go(2)">להשוואה מול הפרופילים</button></div>';
  document.getElementById('v1').innerHTML=h;
  updProg();
}
function acc(title,sub,open,body){
  return '<details class="acc"'+(open?' open':'')+'><summary><span>'+
    '<span class="t">'+esc(title)+'</span><span class="s">'+esc(sub)+'</span></span>'+
    '<span class="chev">+</span></summary><div class="accbody">'+body+'</div></details>';
}
const PROGKEYS=AXES.map(a=>a.k).concat(YN.map(y=>y.k));
function updProg(){
  const box=document.getElementById('prog'); if(!box) return;
  const n=PROGKEYS.filter(k=>V[k]!==undefined).length, t=PROGKEYS.length;
  document.getElementById('progfill').style.width=Math.round(n/t*100)+'%';
  document.getElementById('progtxt').textContent=n+' מתוך '+t;
  box.classList.toggle('full',n===t);
}
function setGender(b){
  const tn=(document.getElementById('txtname')||{}).value||'';
  V.gender=b.dataset.v;
  renderIn(); restoreMarks();
  const f=document.getElementById('txtname'); if(f) f.value=tn;
  const d=document.querySelectorAll('details.acc')[0]; if(d) d.open=true;
}
function restoreMarks(){
  Object.keys(V).forEach(k=>{
    const b=document.querySelector('[data-k="'+k+'"][data-v="'+CSS.escape(V[k])+'"]');
    if(b) b.setAttribute('aria-pressed','true');
  });
  updProg();
}
function pick(b){
  const k=b.dataset.k;
  document.querySelectorAll('[data-k="'+k+'"]').forEach(x=>x.setAttribute('aria-pressed','false'));
  b.setAttribute('aria-pressed','true'); V[k]=b.dataset.v; updProg();
}
function axText(k,i){ const ax=AXES.find(a=>a.k===k); return ax?ax.o[i][gi()]:''; }
function ynText(k){ const y=YN.find(x=>x.k===k); return y?y.t[gi()]:''; }

function renderCmp(){
  let h='<div class="card"><h2>השוואה מול חמשת הפרופילים</h2>'+
   '<p class="sub">לכל פרופיל מוצגים המאפיינים שלו כלשונם, ולצדם הבחירה שלכם.</p>'+
   '<div class="note">✓ הבחירה שלכם זהה למאפיין &nbsp;·&nbsp; ✗ בחרתם אפשרות אחרת באותו ציר &nbsp;·&nbsp; — לא נבחר</div></div>';
  PROFS.forEach(p=>{
    let yes=0, tot=0, rows='';
    Object.keys(p.ax).forEach(k=>{
      tot++; const want=p.ax[k], got=V[k];
      let m='<span class="mark na">—</span>';
      if(got!==undefined){ if(Number(got)===want){m='<span class="mark ok">✓</span>';yes++;} else m='<span class="mark no">✗</span>'; }
      rows+='<li>'+m+'<span>'+esc(axText(k,want))+'</span></li>';
    });
    (p.yn||[]).forEach(k=>{
      tot++; const got=V[k];
      let m='<span class="mark na">—</span>';
      if(got==="כן"){m='<span class="mark ok">✓</span>';yes++;} else if(got==="לא"){m='<span class="mark no">✗</span>';}
      rows+='<li>'+m+'<span>'+esc(ynText(k))+'</span></li>';
    });
    h+='<div class="prof'+(chosen===p.n?' sel':'')+'" style="background:'+p.fill+'">'+
      '<div class="top"><b>פרופיל '+p.n+'</b> — <span>'+esc(p.name)+'</span></div>'+
      '<div class="body"><ul class="desc">'+rows+'</ul>'+
      '<div class="cnt">תואמים: '+yes+' מתוך '+tot+' מאפייני הפרופיל</div>'+
      '<button class="pick" onclick="choose('+p.n+')">'+(chosen===p.n?'✓ נבחר':'בחירה בפרופיל זה')+'</button></div></div>';
  });
  h+='<div class="nav no-print"><button class="ghost" onclick="go(1)">חזרה למאפיינים</button>'+
     '<button class="primary" onclick="go(3)" '+(chosen?'':'disabled')+'>להצעות למיקוד ההוראה</button></div>';
  document.getElementById('v2').innerHTML=h;
}
function toggleProf(n){ openProf=(openProf===n?null:n); renderCmp(); }
function choose(n){ chosen=n; renderCmp(); }

function renderOut(){
  const p=PROFS.find(x=>x.n===chosen);
  const prof=[];
  AXES.forEach(ax=>{ const g=V[ax.k]; if(g!==undefined) prof.push('<li><b>'+esc(ax.t)+':</b> '+esc(axText(ax.k,Number(g)))+'</li>'); });
  YN.forEach(y=>{ if(V[y.k]==="כן") prof.push('<li>'+esc(ynText(y.k))+'</li>'); });
  const grp=(list,title)=>{
    const it=list.filter(f=>V[f.k]!==undefined)
      .map(f=>'<li>'+(V[f.k]==="סימן"?'<span class="ok">✓</span>':'<span class="no">✗</span>')+' '+esc(f.t)+'</li>');
    return it.length?'<p class="cat">'+title+'</p><ul>'+it.join('')+'</ul>':'';
  };
  const marked='<p class="cat">הפרופיל האורייני</p><ul>'+(prof.join('')||'<li>לא סומנו מאפיינים.</li>')+'</ul>'+
    grp(QEMO,'רגש וקריאה')+grp(QSTR,'אסטרטגיות קריאה')+
    (V.kiyul?'<p class="cat">כיול</p><ul><li>'+esc(V.kiyul)+'</li></ul>':'');
  const tn=(document.getElementById('txtname')||{}).value||'';
  const det=[V.ktav,tn].filter(Boolean).join(' · ');
  const answered=QEMO.concat(QSTR).filter(f=>V[f.k]!==undefined);
  const extra=[];
  answered.forEach(f=>f.recs.forEach(r=>{ if(!p.ped.includes(r)&&!extra.includes(r)) extra.push(r); }));
  const ped=p.ped.concat(extra);
  let refl='';
  if(answered.length){
    refl='<h3>ההיגדים שסומנו בשאלונים</h3>'+
      answered.map(f=>'<details class="acc" style="margin-bottom:8px"><summary>'+
        '<span><span class="t" style="font-size:.94rem">'+(V[f.k]==="סימן"?'✓':'✗')+' '+esc(f.t)+'</span>'+
        '<span class="s">'+esc(f.d)+' · '+esc(V[f.k])+'</span></span><span class="chev">+</span></summary>'+
        '<div class="accbody"><p style="margin:0">'+esc(f.learn)+'</p></div></details>').join('');
  }
  let h='<div class="card out">'+
   '<h2>הפרופיל שנבחר</h2>'+
   '<p><span class="badge" style="background:'+p.fill+'">פרופיל '+p.n+' — '+esc(p.name)+'</span></p>'+
   '<p class="sub" style="margin-top:10px"><b>מוקד ההוראה:</b> '+esc(p.prfocus)+'</p>'+
   (det?'<p class="sub"><b>פרטי ההעברה:</b> '+esc(det)+'</p>':'')+
   '<h3>המאפיינים שסומנו</h3>'+marked+
   '<h3>מטרות הוראה</h3><ul>'+p.goals.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'+
   '<h3>הצעות פדגוגיות</h3><ul>'+ped.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'+
   (p.flu?'<h3>פרקטיקות לקידום שטף הקריאה — לפי מוקד</h3><ul>'+p.flu.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'')+
   (p.mats&&p.mats.length?'<h3>חומרי הוראה ולמידה</h3><ul>'+p.mats.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'')+
   '<h3>פרקטיקות נוספות</h3><ul>'+p.prac.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'+
   (p.special?'<div class="warn">'+esc(p.special)+'</div>':'')+
   refl+
   '<h3>מדדי תוצאה — מה ייחשב להצלחה</h3><ul>'+p.meas.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'+
   '<div class="warn">המטרות האופרטיביות נכתבות בתל"א; הפרופיל מזין אותן ואינו בא במקומן. לפני בניית קבוצות הוראה יש לאסוף ראיות נוספות ולא להסתמך על משימת הערכה אחת בלבד.</div>'+
   '</div>'+
   '<div class="nav no-print"><button class="ghost" onclick="go(2)">חזרה לבחירה</button>'+
   '<button class="primary" onclick="window.print()">הדפסה</button></div>';
  document.getElementById('v3').innerHTML=h;
}

function go(n){
  if(n===2) renderCmp();
  if(n===3){ if(!chosen) return; renderOut(); }
  document.getElementById('prog').hidden=(n!==1);
  [1,2,3].forEach(i=>{ document.getElementById('v'+i).hidden=(i!==n);
    document.getElementById('s'+i).className='step'+(i===n?' on':(i<n?' done':'')); });
  window.scrollTo({top:0,behavior:'smooth'});
}
renderIn();
document.getElementById('prog').hidden=false;
</script>
</body>
</html>
